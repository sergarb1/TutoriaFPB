name: Regenerar DOCX

# Regenera los DOCX por unidad cuando cambia el contenido, y los commitea
# solo si algo ha cambiado. El commit lleva [skip ci] para no re-triggerar
# este workflow ni el deploy (los DOCX no forman parte del sitio publicado).

on:
  push:
    branches: [main]
    paths:
      - 'src/content/docs/**'
      - 'scripts/generate-docx.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: "Instalar Pandoc (misma versión que en local: 3.8.3)"
        run: |
          wget -q "https://github.com/jgm/pandoc/releases/download/3.8.3/pandoc-3.8.3-1-amd64.deb"
          sudo dpkg -i pandoc-3.8.3-1-amd64.deb
          pandoc --version | head -1
      - name: Instalar dependencias
        run: npm ci
      - name: Generar DOCX
        run: npm run docx
      - name: Commit de los DOCX (solo si cambia el contenido)
        # Pandoc incrusta la fecha de generación en cada DOCX, así que los
        # binarios SIEMPRE difieren. Comparamos el contenido real
        # (word/document.xml) y solo commiteamos si algo ha cambiado.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docx/
          changed=0
          for f in $(git diff --staged --name-only); do
            if ! git show "HEAD:$f" > /tmp/prev.docx 2>/dev/null; then
              echo "Nuevo: $f"; changed=1; continue
            fi
            old=$(unzip -p /tmp/prev.docx word/document.xml | sha256sum | cut -d' ' -f1)
            new=$(unzip -p "$f" word/document.xml | sha256sum | cut -d' ' -f1)
            if [ "$old" != "$new" ]; then echo "Contenido cambia: $f"; changed=1; fi
          done
          if [ "$changed" = "1" ]; then
            git commit -m "chore: regenerar DOCX [skip ci]"
            git push
          else
            git restore --staged docx/
            echo "DOCX sin cambios de contenido (solo la fecha de pandoc) — nada que commitear."
          fi
